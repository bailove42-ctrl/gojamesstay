{% extends "base.html" %}
{% block title %}ลืมรหัสผ่าน{% endblock %}
{% block content %}
<div class="login-page">
    <div class="login-card gojames-login-card">
        <div class="login-header">
            <img src="{{ url_for('static', filename='gojames_logo.png') }}" alt="GoJames" class="login-brand-logo">
            <h2>ลืมรหัสผ่าน</h2>
            <p>กรอกอีเมลที่ใช้สมัครสมาชิกเพื่อรับลิงก์รีเซ็ตรหัสผ่าน</p>
        </div>

        <form method="post" class="login-form">
            <label>อีเมล</label>
            <input type="email" name="email" placeholder="example@email.com" required>
            <button class="btn login-submit-btn" type="submit">ส่งลิงก์รีเซ็ต</button>
        </form>

        <div class="login-links">
            <a href="{{ url_for('login') }}">กลับไปหน้าเข้าสู่ระบบ</a>
        </div>
    </div>
</div>

<style>
.login-page{
    display:flex;
    justify-content:center;
    padding:32px 16px 48px;
}
.gojames-login-card{
    width:100%;
    max-width:460px;
    margin:auto;
    border-radius:24px;
    padding:28px 24px 24px;
    box-shadow:0 18px 45px rgba(91, 58, 130, 0.10);
    border:1px solid rgba(168, 128, 255, 0.15);
    background:rgba(255,255,255,0.96);
}
.login-header{
    text-align:center;
    margin-bottom:18px;
}
.login-brand-logo{
    display:block;
    height:68px;
    width:auto;
    margin:0 auto 8px;
}
.login-header h2{
    margin:0;
    font-size:2rem;
}
.login-header p{
    margin:6px auto 0;
    color:#7b6d90;
    max-width:330px;
}
.login-form input{
    width:100%;
    box-sizing:border-box;
    padding:13px 14px;
    border-radius:14px;
    border:1px solid #ddd4ea;
    background:#fff;
    font-size:1rem;
}
.login-form label{
    display:block;
    margin:14px 0 6px;
    font-weight:700;
}
.login-submit-btn{
    width:100%;
    margin-top:18px;
    border-radius:14px;
    padding:13px 16px;
    font-size:1rem;
    background:linear-gradient(135deg, #a97cff, #7f63e6);
}
.login-links{
    margin-top:16px;
    text-align:center;
}
.login-links a{
    color:#6b52cf;
    font-weight:700;
    text-decoration:none;
}
.login-links a:hover{
    text-decoration:underline;
}
</style>
{% endblock %}
